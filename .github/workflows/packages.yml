# Native packages (installers) of an nbfx release, built with Apache NetBeans nbpackage from the
# release's nbfx-<version>-bin.zip (gluonhq/nbfx), a bundled JDK and the configurations of this
# repository (README.md).
#
#   workflow_dispatch     `tag` names the gluonhq/nbfx release whose zip is packaged; `publish`
#                         puts the packages on a release of this repository named after that tag,
#                         or on its rolling "snapshot" pre-release; the workflow artifacts hold
#                         them in any case.
#   repository_dispatch   the same, driven by another workflow: event type `nbfx-release`,
#                         client_payload {"tag": "...", "publish": "..."}.
#
# One job obtains the zip, one builds nbpackage from source, then a matrix of (platform, package
# type) jobs package, and the last job collects every package into one artifact and publishes.
# Signing and notarization (macOS) happen when the secrets are set; otherwise the packages are
# unsigned, which is what a fork gets. Nothing is written to gluonhq/nbfx: the default token
# reads its published releases, and the packages are released here.
name: Packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: gluonhq/nbfx release tag whose nbfx-<version>-bin.zip to package
        required: true
      publish:
        description: Where to publish the packages, besides the workflow artifacts
        type: choice
        options: [nowhere, snapshot, release]
        default: nowhere
  repository_dispatch:
    types: [nbfx-release]

permissions:
  contents: write

concurrency:
  group: packages-${{ inputs.tag || github.event.client_payload.tag }}

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  # the repository whose releases are packaged
  NBFX_REPOSITORY: gluonhq/nbfx
  TAG: ${{ inputs.tag || github.event.client_payload.tag }}
  PUBLISH: ${{ inputs.publish || github.event.client_payload.publish || 'nowhere' }}
  # nbpackage is built from source at this commit of apache/netbeans-nbpackage (master of
  # 2026-10-01: release 1.0 plus dependency updates). Move the pin to take a newer one.
  NBPACKAGE_REPOSITORY: apache/netbeans-nbpackage
  NBPACKAGE_REF: 4edb5c02f116d0ac11e4cf0f19db4951d297c15c

jobs:
  binary:
    name: The binary zip
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.zip.outputs.version }}
      label: ${{ steps.zip.outputs.label }}
    steps:
      - name: Check the inputs
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::no release tag given"; exit 1
          fi
          case "$PUBLISH" in nowhere|snapshot|release) ;; *)
            echo "::error::publish must be nowhere, snapshot or release, not '$PUBLISH'"; exit 1;; esac

      # the zip the release manager uploaded, checked against its .sha512 when present; the default
      # token reads a published release or pre-release of the public repository, not a draft
      - name: Download nbfx-<version>-bin.zip of ${{ env.TAG }}
        run: |
          mkdir -p input
          gh release download "$TAG" --repo "$NBFX_REPOSITORY" \
            --pattern 'nbfx-*-bin.zip' --pattern 'nbfx-*-bin.zip.sha512' --dir input \
            || { echo "::error::$NBFX_REPOSITORY release $TAG has no nbfx-<version>-bin.zip (or is a draft)"; exit 1; }
          cd input
          for sum in *.sha512; do [ -f "$sum" ] && sha512sum -c "$sum"; done
          ls -l

      - name: Version and label
        id: zip
        run: |
          zip=$(cd input && ls nbfx-*-bin.zip)
          version=${zip#nbfx-}; version=${version%-bin.zip}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # the label names the artifacts
          echo "label=$TAG" >> "$GITHUB_OUTPUT"
          echo "packaging $zip of $NBFX_REPOSITORY $TAG"

      - uses: actions/upload-artifact@v7
        with:
          name: nbfx-bin-zip
          path: input/nbfx-*-bin.zip
          if-no-files-found: error
          retention-days: 7

  nbpackage:
    name: Build nbpackage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.NBPACKAGE_REPOSITORY }}
          ref: ${{ env.NBPACKAGE_REF }}
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: oracle
          java-version: '25'
          cache: maven

      - name: mvnw package
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package

      - uses: actions/upload-artifact@v7
        with:
          name: nbpackage
          path: target/nbpackage-*-bin.zip
          if-no-files-found: error
          retention-days: 7

  package:
    name: ${{ matrix.type }} (${{ matrix.platform }})
    needs: [binary, nbpackage]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # the configuration is <platform>/<type>.properties; no macOS x64 package: the zip
          # serves that platform (README.md)
          - platform: macos-aarch64
            type: macos-pkg
            os: macos-15
          # the runner image has Inno Setup
          - platform: windows-x64
            type: windows-innosetup
            os: windows-2025
          - platform: linux-x64
            type: linux-deb
            os: ubuntu-24.04
          - platform: linux-x64
            type: linux-rpm
            os: ubuntu-24.04
          - platform: linux-x64
            type: linux-appimage
            os: ubuntu-24.04
    env:
      VERSION: ${{ needs.binary.outputs.version }}
      LABEL: ${{ needs.binary.outputs.label }}
      CONFIG: ${{ matrix.platform }}/${{ matrix.type }}.properties
      # macOS signing and notarization; empty: unsigned
      MACSIGN_USER: ${{ secrets.MACSIGN_USER }}
      NOTARIZATION_USERNAME: ${{ secrets.NOTARIZATION_USERNAME }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: nbfx-bin-zip
          path: input

      - uses: actions/download-artifact@v8
        with:
          name: nbpackage
          path: nbpackage

      # nbpackage needs JDK 21+; the package bundles its own
      - uses: actions/setup-java@v6
        with:
          distribution: oracle
          java-version: '25'

      - name: Unpack nbpackage
        shell: bash
        run: |
          cd nbpackage
          unzip -q nbpackage-*-bin.zip
          mods=$(find . -mindepth 2 -maxdepth 2 -type d -name mods | head -1)
          [ -n "$mods" ] || { echo "::error::no nbpackage-*/mods in the nbpackage artifact"; exit 1; }
          echo "NBPACKAGE_MODS=nbpackage/${mods#./}" >> "$GITHUB_ENV"

      # the pinned JDK (and appimagetool) of runtimes.properties, into the downloads/ directory
      # the configuration points at, checked against the pinned SHA-256
      - name: Download the runtime
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          TYPE: ${{ matrix.type }}
        run: |
          props=runtimes.properties
          pin() { sed -n "s/^$1=//p" "$props"; }
          fetch() {
            local file url sha dir
            file=$(pin "$1.$PLATFORM.file"); url=$(pin "$1.$PLATFORM.url"); sha=$(pin "$1.$PLATFORM.sha256")
            [ -n "$file" ] && [ -n "$url" ] && [ -n "$sha" ] || { echo "::error::$1.$PLATFORM is not pinned in $props"; exit 1; }
            dir="$PLATFORM/downloads"
            mkdir -p "$dir"
            curl --fail --location --retry 5 --retry-all-errors --output "$dir/$file" "$url"
            if command -v sha256sum > /dev/null; then
              echo "$sha  $dir/$file" | sha256sum -c -
            else
              echo "$sha  $dir/$file" | shasum -a 256 -c -
            fi
          }
          fetch jdk
          # nbpackage (at NBPACKAGE_REF) creates the parent directory of regular file entries only,
          # and the jdk.java.net Linux tarball has no directory entries, so its first symlink in an
          # all-symlink directory (legal/java.compiler/ADDITIONAL_LICENSE_INFO) fails to extract
          # with NoSuchFileException. Repack a .tar.gz runtime with tar, which writes the directory
          # entries, under the same name (nbpackage reads the architecture from it).
          file=$(pin "jdk.$PLATFORM.file")
          case "$file" in
            *.tar.gz)
              dir="$PLATFORM/downloads"
              rm -rf "$dir/repack" && mkdir "$dir/repack"
              tar xzf "$dir/$file" -C "$dir/repack"
              rm -f "$dir/$file"
              tar czf "$dir/$file" -C "$dir/repack" .
              rm -rf "$dir/repack"
              ;;
          esac
          if [ "$TYPE" = linux-appimage ]; then
            fetch appimagetool
            chmod +x "$PLATFORM"/downloads/appimagetool-*.AppImage
          fi

      - name: Install rpm
        if: matrix.type == 'linux-rpm'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Import the signing certificates
        if: matrix.type == 'macos-pkg' && env.MACSIGN_USER != ''
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.CERTIFICATES_PASSWORD }}

      - name: nbpackage
        shell: bash
        env:
          TYPE: ${{ matrix.type }}
          # appimagetool runs without FUSE on the runner
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          mkdir -p dist
          args=(--verbose --config "$CONFIG" --input input/nbfx-*-bin.zip --output dist "-Pversion=$VERSION")
          if [ "$TYPE" = macos-pkg ] && [ -n "$MACSIGN_USER" ]; then
            args+=("-Pmacos.codesign-id=Developer ID Application: $MACSIGN_USER"
                   "-Pmacos.pkgbuild-id=Developer ID Installer: $MACSIGN_USER")
          fi
          java -p "$NBPACKAGE_MODS" -m org.apache.netbeans.nbpackage/org.apache.netbeans.nbpackage.Main "${args[@]}"
          # nbpackage leaves the unpacked image directory next to the package; only the package ships
          for image in dist/*/; do rm -rf "$image"; done
          ls -l dist

      - name: Notarize and staple
        if: matrix.type == 'macos-pkg' && env.MACSIGN_USER != '' && env.NOTARIZATION_USERNAME != ''
        env:
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          NOTARIZATION_TEAMID: ${{ secrets.NOTARIZATION_TEAMID }}
        run: |
          for pkg in dist/*.pkg; do
            xcrun notarytool submit "$pkg" --apple-id "$NOTARIZATION_USERNAME" --password "$NOTARIZATION_PASSWORD" \
              --team-id "$NOTARIZATION_TEAMID" --wait
            xcrun stapler staple "$pkg"
            spctl --assess --type install -vv "$pkg"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: nbfx-${{ env.LABEL }}-${{ matrix.platform }}-${{ matrix.type }}
          path: dist/*
          if-no-files-found: error

  collect:
    name: Collect and publish
    needs: [binary, package]
    runs-on: ubuntu-24.04
    env:
      LABEL: ${{ needs.binary.outputs.label }}
      VERSION: ${{ needs.binary.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: nbfx-${{ needs.binary.outputs.label }}-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          find . -maxdepth 1 -type f -printf '%f\n' | sort | xargs sha256sum > "nbfx-$LABEL-packages.sha256"
          cat "nbfx-$LABEL-packages.sha256"
          ls -l

      # one artifact with every package, whatever is published
      - uses: actions/upload-artifact@v7
        with:
          name: nbfx-${{ env.LABEL }}-packages
          path: dist/*

      # the release of this repository named after the nbfx tag: created on the packaged commit
      # (a pre-release when the tag has a pre-release part, as in 0.1.0-rc1), or, when it exists,
      # its files of the same name replaced
      - name: Publish the release ${{ env.TAG }} of this repository
        if: env.PUBLISH == 'release'
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" --clobber dist/*
          else
            case "$TAG" in *-*) prerelease=--prerelease ;; *) prerelease= ;; esac
            gh release create "$TAG" $prerelease --target "$GITHUB_SHA" \
              --title "nbfx $TAG packages" \
              --notes "Packages of nbfx $VERSION ($NBFX_REPOSITORY $TAG) built from $GITHUB_SHA by the Packages workflow (run $GITHUB_RUN_ID)." \
              dist/*
          fi

      # the rolling snapshot of this repository: one pre-release, recreated on the packaged commit
      - name: Update the snapshot pre-release
        if: env.PUBLISH == 'snapshot'
        run: |
          gh release delete snapshot --cleanup-tag --yes || true
          gh release create snapshot --prerelease --target "$GITHUB_SHA" \
            --title "nbfx $TAG packages (snapshot)" \
            --notes "Packages of nbfx $VERSION ($NBFX_REPOSITORY $TAG) built from $GITHUB_SHA by the Packages workflow (run $GITHUB_RUN_ID), for testing. Not a release." \
            dist/*
